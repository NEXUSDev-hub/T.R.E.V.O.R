name: TREVOR Debug APK
# Phase 1 build trigger: 2026-09-28

on:
  push:
    branches:
      - main
      - feature/robot-control-center
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trevor-debug-apk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify TREVOR Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Part 5 unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Clean debug build
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK artifact
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 12
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Upload verified Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TREVOR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  firmware:
    name: Compile ESP32-C3 robot firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install pinned ESP32 Arduino core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7

      - name: Compile active BLE motor-control firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32c3 firmware/esp32c3_trevor_ble
